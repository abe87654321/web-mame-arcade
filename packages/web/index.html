<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web MAME Arcade</title>
    <style>
      /* Dithered theme tokens (T27 baseline): warm paper surface, dark brown
         ink, burnt-orange accent, hard edges and a hard offset shadow. */
      :root {
        --bg: #fff4cf;
        --surface: #fffaf0;
        --surface-warm: #ffdca8;
        --fg: #2a1810;
        --fg-2: #593625;
        --muted: #8a6652;
        --border: #d9aa7a;
        --border-soft: #efd0ab;
        --accent: #d24b1f;
        --accent-hover: #c43e15;
        --accent-press: #a03020;
        --accent-on: #ffffff;
        --success: #3d8f4f;
        --success-edge: #2e7a40;
        --warn: #f2a93b;
        --warn-ink: #b8730f;
        --danger: #b83a2f;
        --border-strong: #c4956a;
        /* Off-panel surfaces: the black game canvas and its status line. */
        --canvas: #000000;
        --on-canvas: #eeeeee;
        --font-display: "Courier New", ui-monospace, monospace;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: "Courier New", ui-monospace, monospace;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --elev-raised: 6px 6px 0 rgba(42, 24, 16, 0.26);
        --elev-control: 2px 2px 0 rgba(42, 24, 16, 0.1);
        --focus-ring: 0 0 0 4px rgba(210, 75, 31, 0.28);
        /* 1-bit dithered dot field, layered over the warm header fill. */
        --dither-dots: radial-gradient(circle, rgba(210, 75, 31, 0.16) 0.9px, transparent 1.1px);
        --dither-size: 4px 4px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--canvas);
        overflow: hidden;
      }
      /* Fit MAME's framebuffer to the viewport without distortion or scrollbars
         (#canvas is the element SDL3 renders into). */
      #canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: contain;
        image-rendering: pixelated;
      }
      /* Overlays: the canvas fills the viewport, so the lobby/status must float
         on top of it rather than flow below it. */
      .lobby-host {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
      }
      .lobby {
        width: 340px;
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 32px);
        box-sizing: border-box;
        background: var(--surface);
        color: var(--fg);
        font: 14px/1.45 var(--font-body);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--elev-raised);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* Header: the warm marquee carries the 1-bit dithered dot field. */
      .lobby-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 14px 10px;
        background-color: var(--surface-warm);
        background-image: var(--dither-dots);
        background-size: var(--dither-size);
        border-bottom: 1px solid var(--border);
      }
      .lobby-title {
        margin: 0;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      /* Small marquee "power" block, echoing the hard-edged cabinet trim. */
      .lobby-title::before {
        content: "";
        width: 10px;
        height: 10px;
        flex-shrink: 0;
        background: var(--accent);
        border: 1px solid var(--danger);
        box-shadow: 1px 1px 0 rgba(42, 24, 16, 0.25);
      }
      .lobby-status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--fg-2);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 9999px;
        padding: 3px 9px;
        white-space: nowrap;
      }
      .lobby-status::before {
        content: "";
        width: 6px;
        height: 6px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--warn);
        box-shadow:
          0 0 0 1px rgba(42, 24, 16, 0.18),
          0 0 5px rgba(242, 169, 59, 0.6);
      }
      .lobby-status.playing::before {
        background: var(--success);
        box-shadow:
          0 0 0 1px rgba(42, 24, 16, 0.18),
          0 0 5px rgba(61, 143, 79, 0.6);
      }
      .lobby-status.ended::before,
      .lobby-status.disconnected::before {
        background: var(--danger);
        box-shadow:
          0 0 0 1px rgba(42, 24, 16, 0.18),
          0 0 5px rgba(184, 58, 47, 0.55);
      }
      .lobby-players {
        padding: 9px 14px 10px;
        border-bottom: 1px solid var(--border);
      }
      .lobby-label {
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 7px;
      }
      .lobby-slots {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .slots-head,
      .lobby-slot {
        display: grid;
        grid-template-columns: 28px 1fr auto auto;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
      }
      .slots-head {
        padding-bottom: 2px;
      }
      .slots-head__col {
        font-family: var(--font-mono);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--border);
      }
      .slots-head__col:nth-child(1),
      .slots-head__col:nth-child(4) {
        text-align: center;
      }
      .slots-head__col:nth-child(3) {
        text-align: right;
      }
      .lobby-slot {
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        transition:
          background 80ms ease,
          border-color 80ms ease;
      }
      .lobby-slot:hover {
        background: rgba(210, 75, 31, 0.05);
        border-color: var(--border-soft);
      }
      .lobby-slot.self {
        background: rgba(255, 220, 168, 0.5);
        border-color: var(--border-soft);
      }
      .lobby-slot.self:hover {
        background: rgba(255, 220, 168, 0.75);
      }
      .lobby-slot.connecting {
        opacity: 0.6;
      }
      .slot-id {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--fg-2);
        text-align: center;
      }
      .slot-name {
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lobby-slot.connecting .slot-name {
        font-style: italic;
        font-weight: 400;
        color: var(--muted);
      }
      .slot-tags {
        display: flex;
        justify-content: flex-end;
        gap: 3px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .tag {
        font-family: var(--font-mono);
        font-size: 8px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 2px 5px;
        border-radius: 3px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .tag.host {
        background: var(--accent);
        color: var(--accent-on);
        border: 1px solid var(--danger);
      }
      .tag.you {
        background: var(--success);
        color: var(--accent-on);
        border: 1px solid var(--success-edge);
      }
      /* Ready badge doubles as a lamp: dot + text, never colour alone. */
      .ready {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-family: var(--font-mono);
        font-size: 8px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 2px 6px;
        border-radius: 3px;
        border: 1px solid;
        min-width: 62px;
        text-align: center;
        white-space: nowrap;
      }
      .ready::before {
        content: "";
        width: 6px;
        height: 6px;
        flex-shrink: 0;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 1px rgba(42, 24, 16, 0.12);
      }
      .ready.on {
        color: var(--success);
        border-color: rgba(61, 143, 79, 0.3);
        background: rgba(61, 143, 79, 0.12);
      }
      .ready.on::before {
        box-shadow:
          0 0 0 1px rgba(42, 24, 16, 0.15),
          0 0 5px rgba(61, 143, 79, 0.6);
      }
      .ready.off {
        color: var(--muted);
        border-color: var(--border);
        background: rgba(138, 102, 82, 0.08);
      }
      .ready.connecting {
        color: var(--warn-ink);
        border-color: rgba(242, 169, 59, 0.45);
        background: rgba(242, 169, 59, 0.14);
      }
      .ready.connecting::before {
        background: var(--warn);
        animation: lobby-blink 1.2s ease-in-out infinite;
      }
      @keyframes lobby-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      .lobby-controls {
        display: flex;
        align-items: stretch;
        gap: 6px;
        padding: 10px 14px 12px;
        border-bottom: 1px solid var(--border);
      }
      .lobby-controls button {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--fg);
        cursor: pointer;
        box-shadow: var(--elev-control);
        transition:
          background 100ms ease,
          border-color 100ms ease,
          box-shadow 100ms ease,
          transform 60ms ease;
      }
      .lobby-controls button:hover:not(:disabled) {
        background: var(--surface-warm);
        border-color: var(--border-strong);
      }
      .lobby-controls button:active:not(:disabled) {
        transform: translateY(1px);
        box-shadow: 1px 1px 0 rgba(42, 24, 16, 0.1);
      }
      .lobby-controls button:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      .lobby-controls button:disabled {
        cursor: not-allowed;
      }
      .lobby-controls .start-game {
        flex: 1;
        background: var(--accent);
        border-color: var(--danger);
        color: var(--accent-on);
        box-shadow: 2px 2px 0 rgba(42, 24, 16, 0.18);
      }
      .lobby-controls .start-game:hover:not(:disabled) {
        background: var(--accent-hover);
        border-color: var(--accent-press);
        box-shadow: 3px 3px 0 rgba(42, 24, 16, 0.2);
      }
      /* Locked until every peer is connected + ready: hatched, not just faded. */
      .lobby-controls .start-game:disabled {
        opacity: 1;
        color: var(--fg-2);
        background-color: var(--surface-warm);
        background-image: repeating-linear-gradient(
          45deg,
          rgba(184, 58, 47, 0.22) 0 3px,
          transparent 3px 7px
        );
        border-color: var(--border-strong);
        border-style: dashed;
        box-shadow: none;
      }
      .lobby-controls .ready-toggle {
        flex: 1;
      }
      .lobby-controls .leave {
        flex: 0 0 auto;
        background: transparent;
        border-color: transparent;
        box-shadow: none;
        color: var(--muted);
        padding: 8px;
      }
      .lobby-controls .leave:hover {
        color: var(--accent);
        background: rgba(210, 75, 31, 0.06);
      }
      .lobby-hint {
        flex: 1;
        display: flex;
        align-items: center;
        padding: 0 2px;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .chat {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 14px 12px;
        min-height: 0;
      }
      .chat h3 {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
      .chat p {
        margin: 0;
        font-size: 12px;
        font-style: italic;
        color: var(--muted);
        text-align: center;
        background: rgba(217, 170, 122, 0.12);
        border: 1px dashed var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
      }
      @media (max-width: 420px) {
        .lobby-host {
          top: 8px;
          right: 8px;
        }
        .lobby {
          max-width: calc(100vw - 16px);
        }
      }
      @media (max-height: 640px) {
        .lobby-slot {
          padding-top: 3px;
          padding-bottom: 3px;
        }
        .slots-head {
          display: none;
        }
      }
      .status {
        position: fixed;
        left: 10px;
        bottom: 8px;
        margin: 0;
        z-index: 10;
        color: var(--on-canvas);
        font: 13px/1.4 var(--font-body);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
