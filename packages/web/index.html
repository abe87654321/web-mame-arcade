<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web MAME Arcade</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* Fit MAME's framebuffer to the viewport without distortion or scrollbars
         (#canvas is the element SDL3 renders into). */
      #canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: contain;
        image-rendering: pixelated;
      }
      /* Overlays: the canvas fills the viewport, so lobby/status must float on
         top of it rather than flow below it. */
      .lobby {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
      }
      .status {
        position: fixed;
        left: 10px;
        bottom: 8px;
        margin: 0;
        z-index: 10;
        color: #ddd;
        font: 13px/1.4 system-ui, sans-serif;
      }
      .lobby button {
        padding: 8px 16px;
        font: 14px system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
