# Dev server for the built web bundle and the WASM cores (T13).
#
#   pnpm --filter @wma/web build
#   mkdir -p packages/web/dist/static packages/web/dist/roms
#   cp -r core/out/. packages/web/dist/static/cores/      # core/out/<driver>/<hash>/
#   cp roms/<driver>.zip packages/web/dist/roms/
#   nginx -c "$PWD/packages/web/nginx.dev.conf" -p "$PWD/packages/web"
#
# Hash routing means every page is index.html, so a plain try_files fallback is
# enough. COOP/COEP are mandatory for Emscripten threads/Pthreads (docs/02).

worker_processes 1;
error_log stderr notice;
pid /tmp/wma-nginx.pid;

events {
  worker_connections 128;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/wasm wasm;
  }
  default_type application/octet-stream;
  access_log off;
  sendfile on;

  server {
    listen 8080;
    server_name localhost;

    # Emscripten SharedArrayBuffer / threads require cross-origin isolation.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    root dist;

    # Immutable, content-addressed cores: safe to cache forever.
    location /static/cores/ {
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Embedder-Policy require-corp always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Dev-only ROMs; real deploys use signed URLs (docs/06, T42).
    location /roms/ {
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Embedder-Policy require-corp always;
      try_files $uri =404;
    }

    location / {
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Embedder-Policy require-corp always;
      try_files $uri $uri/ /index.html;
    }
  }
}
