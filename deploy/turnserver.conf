# coturn configuration for local development (T23). The shared secret, realm
# and external IP are passed on the docker-compose command line from
# deploy/.env so no secret is stored in this file.
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
min-port=49152
max-port=65535
no-multicast-peers
no-cli
