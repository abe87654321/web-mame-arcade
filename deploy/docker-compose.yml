# Arcade service compose. T23 adds coturn for WebRTC NAT traversal; T41 adds
# LiveKit for the host's opt-in A/V fallback; T36 adds PostgreSQL so the API/verifier
# migrations can be applied in local dev. The relay, API, nginx and verifier
# services land with later tasks (T42).
#
# Usage:
#   cp deploy/.env.example deploy/.env   # then edit TURN_SECRET / TURN_EXTERNAL_IP
#   docker compose -f deploy/docker-compose.yml config
#   docker compose -f deploy/docker-compose.yml up -d postgres
#
# Apply the schema against it:
#   WMA_PG_URL=postgres://wma:$POSTGRES_PASSWORD@localhost:5432/wma \
#     pnpm --filter @wma/api migrate
#
# Host networking is used so coturn's UDP relay range (see turnserver.conf) is
# reachable without enumerating every port. LiveKit uses explicit port mappings
# (WS 7880, RTC/UDP 50000-50100) instead.
services:
  # PostgreSQL for local dev: accounts, catalogue, matches, scores and the T36
  # anti-cheat `match_flags`. T42 replaces this with the production service
  # (backups, monitoring); the password is required from deploy/.env.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-wma}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wma} -d ${POSTGRES_DB:-wma}"]
      interval: 5s
      timeout: 3s
      retries: 10

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - "--config=/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET in deploy/.env}"
      - "--realm=${TURN_REALM:-web-mame-arcade}"
      - "--external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in deploy/.env}"

  # LiveKit SFU for the host's opt-in A/V fallback (T41). The relay mints
  # access tokens with the same API key/secret. Egress → HLS is deferred.
  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command:
      - "--config=/etc/livekit.yaml"
      - "--keys=${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in deploy/.env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in deploy/.env}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

volumes:
  pgdata:
